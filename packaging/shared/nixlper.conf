# nixlper system configuration
# Managed by the package manager (RPM/DEB) — edit to set system-wide defaults.
# All values use :- so any variable already set in ~/.bashrc (manual install) takes precedence.
# Users can override any value in ~/.config/nixlper/nixlper.conf.
# Keep in sync with _NIXLPER_CONFIG_VARS (functions_config.sh) — enforced by scripts/check-feature-completeness.sh.

export NIXLPER_INSTALL_DIR="${NIXLPER_INSTALL_DIR:-/usr/share/nixlper}"
export NIXLPER_NAVIGATE_MODE="${NIXLPER_NAVIGATE_MODE:-tree}"
export NIXLPER_EDITOR="${NIXLPER_EDITOR:-vim}"
export NIXLPER_DISABLE_WELCOME_MESSAGE="${NIXLPER_DISABLE_WELCOME_MESSAGE:-false}"
export NIXLPER_DISABLE_TIPS="${NIXLPER_DISABLE_TIPS:-false}"
export NIXLPER_DEBUG="${NIXLPER_DEBUG:-false}"
export NIXLPER_JOKE_LANG="${NIXLPER_JOKE_LANG:-auto}"

# Update detection — channel is stable|edge|off (see README → Updates).
export NIXLPER_UPDATE_CHANNEL="${NIXLPER_UPDATE_CHANNEL:-stable}"
export NIXLPER_UPDATE_CHECK="${NIXLPER_UPDATE_CHECK:-true}"
export NIXLPER_UPDATE_AUTO="${NIXLPER_UPDATE_AUTO:-false}"
export NIXLPER_UPDATE_CHECK_INTERVAL="${NIXLPER_UPDATE_CHECK_INTERVAL:-86400}"
export NIXLPER_UPDATE_TIMEOUT="${NIXLPER_UPDATE_TIMEOUT:-2}"

# Admin login notice (bset/bshow/bclear) — system-wide file.
export NIXLPER_DISABLE_BROADCAST_MESSAGE="${NIXLPER_DISABLE_BROADCAST_MESSAGE:-false}"
export NIXLPER_BROADCAST_MESSAGE_FILE="${NIXLPER_BROADCAST_MESSAGE_FILE:-/etc/nixlper/broadcast_message}"

# Target staging.
export NIXLPER_TARGET_DIR="${NIXLPER_TARGET_DIR:-/tmp/nixlper_target}"
export NIXLPER_TARGET_CHMOD="${NIXLPER_TARGET_CHMOD:-777}"

# Per-user paths — $HOME expands at login time for each user.
export NIXLPER_BOOKMARKS_FILE="${NIXLPER_BOOKMARKS_FILE:-${HOME}/.local/share/nixlper/bookmarks}"
export NIXLPER_LAST_MACRO_BINDING_FILE="${NIXLPER_LAST_MACRO_BINDING_FILE:-${HOME}/.local/share/nixlper/last_macro_binding}"
export NIXLPER_SNAPSHOT_DIR="${NIXLPER_SNAPSHOT_DIR:-${HOME}/.local/share/nixlper/snapshots}"
export NIXLPER_CUSTOM_DIR="${NIXLPER_CUSTOM_DIR:-${HOME}/.config/nixlper/custom}"
export NIXLPER_UPDATE_CACHE_FILE="${NIXLPER_UPDATE_CACHE_FILE:-${HOME}/.local/share/nixlper/update_check}"
export NIXLPER_RECENT_DIRS_FILE="${NIXLPER_RECENT_DIRS_FILE:-${HOME}/.local/share/nixlper/recent_dirs}"
export NIXLPER_SSH_CONNECTIONS_FILE="${NIXLPER_SSH_CONNECTIONS_FILE:-${HOME}/.config/nixlper/ssh_connections}"
export NIXLPER_SSH_IDENTITY_FILE="${NIXLPER_SSH_IDENTITY_FILE:-${HOME}/.ssh/nixlper_id_rsa}"

# Pickers, history and feature tuning.
export NIXLPER_BOOKMARKS_FUZZY="${NIXLPER_BOOKMARKS_FUZZY:-true}"
export NIXLPER_RECENT_DIRS_MAX="${NIXLPER_RECENT_DIRS_MAX:-20}"
export NIXLPER_RECENT_DIRS_FUZZY="${NIXLPER_RECENT_DIRS_FUZZY:-true}"
export NIXLPER_LAST_COMMAND_MAX="${NIXLPER_LAST_COMMAND_MAX:-50}"
export NIXLPER_LAST_COMMAND_FUZZY="${NIXLPER_LAST_COMMAND_FUZZY:-true}"
export NIXLPER_NAVIGATE_FUZZY="${NIXLPER_NAVIGATE_FUZZY:-true}"
export NIXLPER_KILL_FUZZY="${NIXLPER_KILL_FUZZY:-true}"
export NIXLPER_HEALTH_WARN_PCT="${NIXLPER_HEALTH_WARN_PCT:-80}"
export NIXLPER_HEALTH_CRIT_PCT="${NIXLPER_HEALTH_CRIT_PCT:-90}"
export NIXLPER_HEALTH_TOP_N="${NIXLPER_HEALTH_TOP_N:-3}"
export NIXLPER_LOGTAIL_IGNORE_CASE="${NIXLPER_LOGTAIL_IGNORE_CASE:-false}"
export NIXLPER_LOGTAIL_LINES="${NIXLPER_LOGTAIL_LINES:-10}"
export NIXLPER_REPLACE_SNAPSHOT="${NIXLPER_REPLACE_SNAPSHOT:-true}"
export NIXLPER_PORT_CHECK_SHOW_CMDLINE="${NIXLPER_PORT_CHECK_SHOW_CMDLINE:-true}"
